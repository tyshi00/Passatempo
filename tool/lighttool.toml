[tool]
id          = "com.tyshi00.games"
label       = "Passatempo"
versionCode = 22
versionName = "1.1.0"
permissions = ["android.permission.VIBRATE"]  # needed for haptic feedback on tap
# Must be com.lightos on a real LP3. LightServiceConnection binds to this
# package; with the emulator value the bind fails on device, GetUserPreferences
# errors out, and haptics stay off with no visible symptom.
# Swap these two lines to run in the desktop emulator instead.
serverPackage = "com.lightos"
# serverPackage = "com.thelightphone.sdk.emulator"
